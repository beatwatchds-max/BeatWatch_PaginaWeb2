name: DAST - ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL de un entorno de staging autorizado (no producción)'
        required: true
        type: string
      authorized:
        description: 'Confirmo que tengo autorización para escanear este entorno'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  zap-baseline:
    if: ${{ inputs.authorized == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create report directory
        run: mkdir -p security-reports

      - name: Run ZAP baseline scan
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          docker run --rm \
            -v "$PWD/security-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET_URL" -r zap-report.html -J zap-report.json

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: security-reports/
          if-no-files-found: warn
