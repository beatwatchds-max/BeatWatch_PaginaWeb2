name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-security-gates:
    name: quality-and-security-gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.12.0
        uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security policy tests
        run: npm run test:security

      - name: Build
        env:
          VITE_API_URL: https://ci.invalid.example
          VITE_FREE_LICENSE_METHOD: Gratuito
        run: npm run build

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high