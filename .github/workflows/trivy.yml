name: Trivy Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 8 * * 2'

permissions:
  contents: read

jobs:
  filesystem-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
